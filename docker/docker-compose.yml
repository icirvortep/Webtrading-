services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: atb
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "8080:8080"
    volumes:
      - ../data:/app/data
      - ../config:/app/config:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

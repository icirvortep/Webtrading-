# ============================================================
#  Adaptive Trading Bot — hlavní konfigurace
#  Vše lze přepsat proměnnými prostředí (viz .env.example).
# ============================================================

# paper = simulace na reálných datech, live = skutečné objednávky
mode: paper
# dry_run: i v live režimu jen počítá plán a nic neodešle (bezpečný mezikrok)
dry_run: true
log_level: INFO
log_json: false
database: data/atb.sqlite

# prázdný allowlist = povoleno vše, co burza nabízí
symbols_allowlist:
  - BTC/USDT:USDT
  - ETH/USDT:USDT
  - SOL/USDT:USDT
symbols_blocklist: []

exchange:
  id: bybit                 # `python -m atb venues` vypíše všechny možnosti
  account_type: swap        # perpetual futures
  quote: USDT
  testnet: true             # NEJDŘÍV testnet, teprve pak reálné peníze
  api_key_env: EXCHANGE_API_KEY
  api_secret_env: EXCHANGE_API_SECRET
  password_env: null        # OKX/Bitget: EXCHANGE_API_PASSWORD
  hedge_mode: false
  margin_mode: isolated     # isolated omezí ztrátu na marži dané pozice

risk:
  risk_per_trade_pct: 2.0       # ← požadovaná 2 % majetku na obchod
  max_risk_per_trade_pct: 3.0   # tvrdý strop i po adaptivním navýšení
  max_portfolio_risk_pct: 6.0   # součet rizika všech otevřených pozic
  max_daily_loss_pct: 6.0       # denní stop-loss celého účtu
  max_daily_trades: 20
  max_open_positions: 4
  max_positions_per_symbol: 1
  max_leverage: 20              # strop páky nezávisle na burze
  min_leverage: 1
  max_notional_pct_of_equity: 500.0
  min_notional_usd: 5.0
  cooldown_after_loss_min: 15
  cooldown_after_streak: 3
  streak_cooldown_min: 120
  max_spread_bps: 12.0
  signal_max_age_sec: 90
  kill_switch: false            # true = okamžitě zastaví všechny nové vstupy

strategy:
  enabled: true
  htf_multiplier: 4             # vyšší timeframe pro potvrzení trendu
  ohlcv_limit: 300
  atr_period: 14
  adx_period: 14
  rsi_period: 14
  ema_fast: 21
  ema_slow: 55
  bb_period: 20
  adx_trend_threshold: 23.0
  adx_range_threshold: 18.0
  volatile_atr_pct: 3.0
  quiet_atr_pct: 0.35
  min_score: 0.45               # pod tímto skóre se signál nezobchoduje
  veto_counter_trend: true
  adaptive_learning: true       # uprav riziko podle historické úspěšnosti v režimu
  learning_min_trades: 12
  learning_max_multiplier: 1.3
  learning_min_multiplier: 0.4

exits:
  # násobek ATR pro stop loss v jednotlivých režimech
  sl_atr_mult:
    trend_up: 2.0
    trend_down: 2.0
    range: 1.2
    volatile: 3.0
    quiet: 1.5
  # take profity jako násobky R (R = vzdálenost ke stop lossu)
  tp_r_multiples:
    trend_up: [1.0, 2.0, 3.5]
    trend_down: [1.0, 2.0, 3.5]
    range: [0.8, 1.5]
    volatile: [1.2, 2.5, 4.0]
    quiet: [1.0, 1.8]
  # jaký podíl pozice zavřít na kterém TP
  tp_fractions:
    trend_up: [0.4, 0.35, 0.25]
    trend_down: [0.4, 0.35, 0.25]
    range: [0.6, 0.4]
    volatile: [0.5, 0.3, 0.2]
    quiet: [0.6, 0.4]
  trail_atr_mult:
    trend_up: 2.5
    trend_down: 2.5
    range: 1.2
    volatile: 3.5
    quiet: 1.5
  min_sl_pct: 0.25
  max_sl_pct: 8.0
  breakeven_after_tp: 1         # po TP1 posuň SL na breakeven
  breakeven_offset_pct: 0.05
  trail_after_tp: 2             # po TP2 zapni ATR trailing
  max_hold_minutes: 0           # 0 = bez časového stopu
  use_exchange_stops: true      # SL/TP leží přímo na burze (přežijí výpadek bota)

webhook:
  host: 0.0.0.0
  port: 8080
  path: /webhook/tradingview
  secret_env: WEBHOOK_SECRET
  require_hmac: true
  enforce_ip_allowlist: true
  allowed_ips:                  # oficiální odesílací IP TradingView
    - 52.89.214.238
    - 34.212.75.30
    - 54.218.53.128
    - 52.32.178.7
  max_body_bytes: 16384

monitor:
  enabled: true
  poll_seconds: 5.0
  reconcile_seconds: 60.0

notify:
  telegram_enabled: false
  telegram_token_env: TELEGRAM_BOT_TOKEN
  telegram_chat_env: TELEGRAM_CHAT_ID
  notify_levels: [entry, exit, error, risk]

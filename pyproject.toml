[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-trading-bot"
version = "1.0.0"
description = "Adaptivní trading bot: TradingView webhook → řízení rizika → burza s pákou"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0",
    "numpy>=1.26.0",
]

[project.scripts]
atb = "atb.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
